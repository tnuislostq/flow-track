<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowTrack — Menstrual Health & Cycle Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Soft pastel blush, cream, and mauve palette */
      --bg-blush: #fbf1f3;
      --bg-gradient: radial-gradient(circle at 15% 20%, #fdf4f5 0%, #faedf0 45%, #f6e7eb 75%, #fbf8f5 100%);
      --surface-cream: rgba(255, 252, 250, 0.72);
      --surface-cream-hover: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-specular: rgba(255, 255, 255, 0.95);
      --shadow-soft: 0 24px 48px -12px rgba(198, 120, 142, 0.12), 0 10px 20px -6px rgba(0, 0, 0, 0.02);
      --shadow-elevated: 0 32px 64px -16px rgba(186, 96, 122, 0.18);
      --accent-pink: #c86985;
      --accent-pink-hover: #b55571;
      --accent-mauve: #8b4a62;
      --accent-soft-pink: #fbe6eb;
      --text-main: #3d2931;
      --text-muted: #8c737c;
      --radius-card: 32px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-color: var(--bg-blush);
      min-height: 100vh;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Falling Petals Canvas */
    #petals-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* 3D Floating Ambient Spheres */
    .floating-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(50px);
      opacity: 0.65;
      animation: floatMotion 16s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, #fde2e8 0%, #fad2db 60%, transparent 80%);
      top: -100px;
      left: -80px;
    }
    .orb-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #fae9dc 0%, #f6d8c7 60%, transparent 80%);
      bottom: -120px;
      right: -80px;
      animation-delay: -7s;
    }

    @keyframes floatMotion {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(40px, 30px, 0) rotate(8deg); }
      100% { transform: translate3d(-30px, 50px, 0) rotate(-6deg); }
    }

    /* Translucent Frosted Glass Panels */
    .frosted-panel {
      background: var(--surface-cream);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0.1, 1), box-shadow 0.25s ease;
    }

    /* Subtle Glass Specular Reflection Highlight */
    .frosted-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%,
